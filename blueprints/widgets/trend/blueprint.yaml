blueprint:
  name: |
    Aivi: Trend widget using sensors
  description: |
    Updates an Aivi Trend widget from Home Assistant sensors.

    The Trend template shows a current reading with a compact history
    sparkline. The history points come from a template you provide,
    for example from a statistics sensor's attributes.
    See the [docs](https://docs.getaivi.app/widgets/#trend-template) for more info about the template.

    Requires the `rest_command.update_widget` REST command from the
    [blueprint documentation](https://docs.getaivi.app/home-assistant/blueprints/).

  domain: automation
  homeassistant:
    min_version: 2024.10.0

  input:
    slug:
      name: Widget slug
      description: The slug of the widget to update.

    icon:
      name: Icon
      default: ""
      description: |
        An [SF Symbols](https://developer.apple.com/sf-symbols/) icon name.
        Example: thermometer.medium.

    icon_customization:
      name: Icon customization
      icon: mdi:palette
      description: |
        Advanced rendering options for the SF Symbol icon. Leave at defaults
        for the standard monochrome appearance.
      input:
        icon_rendering_mode:
          name: Rendering mode
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: Default
                  value: default
                - label: Monochrome
                  value: monochrome
                - label: Hierarchical
                  value: hierarchical
                - label: Palette
                  value: palette
                - label: Multicolor
                  value: multicolor

        icon_primary_color:
          name: Primary color
          default: default
          selector:
            select:
              options:
                - default
                - red
                - orange
                - yellow
                - green
                - mint
                - teal
                - cyan
                - blue
                - indigo
                - purple
                - pink
                - brown
                - gray
                - gray2
                - gray3
                - gray4
                - gray5
                - gray6

        icon_secondary_color:
          name: Secondary color (palette mode)
          default: default
          selector:
            select:
              options:
                - default
                - red
                - orange
                - yellow
                - green
                - mint
                - teal
                - cyan
                - blue
                - indigo
                - purple
                - pink
                - brown
                - gray
                - gray2
                - gray3
                - gray4
                - gray5
                - gray6

        icon_tertiary_color:
          name: Tertiary color (palette mode)
          default: default
          selector:
            select:
              options:
                - default
                - red
                - orange
                - yellow
                - green
                - mint
                - teal
                - cyan
                - blue
                - indigo
                - purple
                - pink
                - brown
                - gray
                - gray2
                - gray3
                - gray4
                - gray5
                - gray6

        icon_color_rendering:
          name: Color rendering
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: Default
                  value: default
                - label: Flat
                  value: flat
                - label: Gradient
                  value: gradient

    accent:
      name: Accent color
      description: |
        An explicit accent color that themes the whole widget on the device,
        independent of the icon color.
      default: default
      selector:
        select:
          options:
            - default
            - red
            - orange
            - yellow
            - green
            - mint
            - teal
            - cyan
            - blue
            - indigo
            - purple
            - pink
            - brown
            - gray
            - gray2
            - gray3
            - gray4
            - gray5
            - gray6

    custom_triggers:
      name: Custom automation triggers
      description: |
        Template fields do not automatically create triggers.
        Add one trigger for each entity referenced by a template field (usually a `state` trigger).
        These triggers are evaluated together with the built-in sensor triggers.
      default: []
      selector:
        trigger:

    value:
      name: Value
      icon: mdi:chart-line
      input:
        value_sensor:
          name: Value (sensor)
          description: A sensor whose numeric state provides the current reading.
          selector:
            entity:
              filter:
                - domain: sensor

        unit:
          name: Unit
          default: ""
          description: |
            The display unit. Leave empty to use the sensor's own unit of
            measurement, if any.

    points:
      name: History points
      icon: mdi:chart-timeline-variant
      input:
        points_template:
          name: Points (template)
          description: |
            A Jinja2 template that evaluates to a list of 2-48 numbers - the
            recent history, oldest first. The device scales them to the sparkline.
            If this template references entities, add matching triggers in "Custom automation triggers".
          selector:
            template:

    state:
      name: State
      icon: mdi:text-short
      input:
        state_sensor:
          name: Value (sensor)
          default: sensor.dummy_non_existent_sensor
          description: A sensor whose state provides the supporting line, e.g. "Rising".
          selector:
            entity:
              filter:
                - domain: sensor

        state_template:
          name: Value (template)
          default: ""
          description: |
            Can be used instead of "Value (sensor)" to provide a templated value.
            If this template references entities, add matching triggers in "Custom automation triggers".
          selector:
            template:

        state_color:
          name: Text color
          default: default
          selector:
            select:
              options:
                - default
                - red
                - orange
                - yellow
                - green
                - mint
                - teal
                - cyan
                - blue
                - indigo
                - purple
                - pink
                - brown
                - gray
                - gray2
                - gray3
                - gray4
                - gray5
                - gray6

        state_color_template:
          name: Text color (template)
          default: ""
          description: |
            Can be used instead of "Text color" to provide a templated color.
            Must evaluate to a valid color name.
            If this template references entities, add matching triggers in "Custom automation triggers".
          selector:
            template:

        state_formatter:
          name: Value formatter
          default: passthrough
          description: |
            Controls how the value is displayed.
            "Time since" shows relative time elapsed since the value (expects a timestamp).
            "Time until" shows relative time remaining until the value (expects a timestamp).
          selector:
            select:
              mode: dropdown
              options:
                - label: Pass through
                  value: passthrough
                - label: Time since
                  value: time_since
                - label: Time until
                  value: time_until

    color:
      name: Sparkline color
      description: |
        The sparkline color. Leave at default to follow the accent color.
      default: default
      selector:
        select:
          options:
            - default
            - red
            - orange
            - yellow
            - green
            - mint
            - teal
            - cyan
            - blue
            - indigo
            - purple
            - pink
            - brown
            - gray
            - gray2
            - gray3
            - gray4
            - gray5
            - gray6

    tap_url:
      name: Tap URL
      icon: mdi:link
      input:
        tap_url_template:
          name: Tap URL (template)
          default: ""
          description: |
            A Jinja2 template for the URL opened when the widget is tapped.
            Supports any URL scheme (https://, homeassistant://, etc.).
            If this template references entities, add matching triggers in "Custom automation triggers".
          selector:
            template:

    staleness:
      name: Staleness
      icon: mdi:clock-alert-outline
      input:
        stale_after:
          name: Mark stale after
          description: |
            Marks the widget's data as stale when no update has arrived within
            this many seconds. Set to 0 to disable. Minimum 60 seconds when enabled.
          default: 0
          selector:
            number:
              min: 0
              max: 604800
              unit_of_measurement: seconds
              mode: box

triggers:
  - trigger: state
    entity_id:
      - !input value_sensor
      - !input state_sensor

  - triggers: !input custom_triggers

variables:
  slug: !input slug
  icon: !input icon
  icon_rendering_mode: !input icon_rendering_mode
  icon_primary_color: !input icon_primary_color
  icon_secondary_color: !input icon_secondary_color
  icon_tertiary_color: !input icon_tertiary_color
  icon_color_rendering: !input icon_color_rendering
  accent: !input accent
  tap_url_template: !input tap_url_template
  stale_after: !input stale_after
  value_sensor: !input value_sensor
  unit: !input unit
  points_template: !input points_template
  state_sensor: !input state_sensor
  state_template: !input state_template
  state_color: !input state_color
  state_color_template: !input state_color_template
  state_formatter: !input state_formatter
  color: !input color

mode: queued
max: 10
max_exceeded: silent

actions:
  - condition: template
    value_template: "{{ has_value(value_sensor) and points_template is list and points_template | length >= 2 }}"

  - action: rest_command.update_widget
    response_variable: aivi_response
    data:
      slug: "{{ slug }}"
      payload: >-
        {% set state = {
          "value": (
            state_template|string
            if state_template
            else (
              state_translated(state_sensor)
              if state_attr(state_sensor, 'unit_of_measurement') is none
              else states(state_sensor, rounded=True, with_unit=True)
            )
          ),
          "text_color": (
            state_color_template|string
            if state_color_template
            else (
              state_color
              if state_color != "default"
              else None
            )
          ),
          "formatter": (
            state_formatter
            if state_formatter != "passthrough"
            else None
          ),
        } if (has_value(state_sensor) or state_template) else None %}

        {% set icon_obj = {
          "name": icon,
          "rendering_mode": icon_rendering_mode if icon_rendering_mode != "default" else None,
          "primary_color": icon_primary_color if icon_primary_color != "default" else None,
          "secondary_color": icon_secondary_color if icon_secondary_color != "default" else None,
          "tertiary_color": icon_tertiary_color if icon_tertiary_color != "default" else None,
          "color_rendering": icon_color_rendering if icon_color_rendering != "default" else None,
        } if icon else None %}

        {% set content = {
          "template": "trend",
          "value": states(value_sensor)|float(0),
          "unit": unit if unit else state_attr(value_sensor, 'unit_of_measurement'),
          "points": points_template | map('float') | list,
          "state": state,
          "color": color if color != "default" else None,
          "icon": icon_obj,
          "accent": accent if accent != "default" else None,
          "tap_url": tap_url_template|string if tap_url_template else None,
        } %}

        {% if stale_after|int(0) > 0 %}
        {{ {"content": content, "stale_after": stale_after|int} | to_json }}
        {% else %}
        {{ {"content": content} | to_json }}
        {% endif %}
