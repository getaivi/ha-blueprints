blueprint:
  name: |
    Aivi: Countdown widget using sensors
  description: |
    Updates an Aivi Countdown widget from a Home Assistant timestamp sensor.

    The Countdown template renders a moment in time as a self-updating
    countdown: a single update sets the target and the device keeps the
    countdown current on its own.
    See the [docs](https://docs.getaivi.app/widgets/#countdown-template) for more info about the template.

    Requires the `rest_command.update_widget` REST command from the
    [blueprint documentation](https://docs.getaivi.app/home-assistant/blueprints/).

  domain: automation
  homeassistant:
    min_version: 2024.10.0

  input:
    slug:
      name: Widget slug
      description: The slug of the widget to update.

    icon:
      name: Icon
      default: ""
      description: |
        An [SF Symbols](https://developer.apple.com/sf-symbols/) icon name.
        Example: trash.fill.

    icon_customization:
      name: Icon customization
      icon: mdi:palette
      description: |
        Advanced rendering options for the SF Symbol icon. Leave at defaults
        for the standard monochrome appearance.
      input:
        icon_rendering_mode:
          name: Rendering mode
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: Default
                  value: default
                - label: Monochrome
                  value: monochrome
                - label: Hierarchical
                  value: hierarchical
                - label: Palette
                  value: palette
                - label: Multicolor
                  value: multicolor

        icon_primary_color:
          name: Primary color
          default: default
          selector:
            select:
              options:
                - default
                - red
                - orange
                - yellow
                - green
                - mint
                - teal
                - cyan
                - blue
                - indigo
                - purple
                - pink
                - brown
                - gray
                - gray2
                - gray3
                - gray4
                - gray5
                - gray6

        icon_secondary_color:
          name: Secondary color (palette mode)
          default: default
          selector:
            select:
              options:
                - default
                - red
                - orange
                - yellow
                - green
                - mint
                - teal
                - cyan
                - blue
                - indigo
                - purple
                - pink
                - brown
                - gray
                - gray2
                - gray3
                - gray4
                - gray5
                - gray6

        icon_tertiary_color:
          name: Tertiary color (palette mode)
          default: default
          selector:
            select:
              options:
                - default
                - red
                - orange
                - yellow
                - green
                - mint
                - teal
                - cyan
                - blue
                - indigo
                - purple
                - pink
                - brown
                - gray
                - gray2
                - gray3
                - gray4
                - gray5
                - gray6

        icon_color_rendering:
          name: Color rendering
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: Default
                  value: default
                - label: Flat
                  value: flat
                - label: Gradient
                  value: gradient

    accent:
      name: Accent color
      description: |
        An explicit accent color that themes the whole widget on the device,
        independent of the icon color.
      default: default
      selector:
        select:
          options:
            - default
            - red
            - orange
            - yellow
            - green
            - mint
            - teal
            - cyan
            - blue
            - indigo
            - purple
            - pink
            - brown
            - gray
            - gray2
            - gray3
            - gray4
            - gray5
            - gray6

    custom_triggers:
      name: Custom automation triggers
      description: |
        Template fields do not automatically create triggers.
        Add one trigger for each entity referenced by a template field (usually a `state` trigger).
        These triggers are evaluated together with the built-in sensor triggers.
      default: []
      selector:
        trigger:

    target:
      name: Target
      icon: mdi:calendar-clock
      input:
        target_sensor:
          name: Target (sensor)
          default: sensor.dummy_non_existent_sensor
          description: A timestamp sensor with the moment the countdown targets.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: timestamp

        target_template:
          name: Target (template)
          default: ""
          description: |
            Can be used instead of "Target (sensor)" to provide a templated target.
            Must evaluate to a timestamp.
            If this template references entities, add matching triggers in "Custom automation triggers".
          selector:
            template:

    subtitle:
      name: Subtitle
      icon: mdi:text-short
      input:
        subtitle_sensor:
          name: Value (sensor)
          default: sensor.dummy_non_existent_sensor
          description: A sensor whose state provides the supporting line, e.g. "Paper & cardboard".
          selector:
            entity:
              filter:
                - domain: sensor

        subtitle_template:
          name: Value (template)
          default: ""
          description: |
            Can be used instead of "Value (sensor)" to provide a templated value.
            If this template references entities, add matching triggers in "Custom automation triggers".
          selector:
            template:

        subtitle_color:
          name: Text color
          default: default
          selector:
            select:
              options:
                - default
                - red
                - orange
                - yellow
                - green
                - mint
                - teal
                - cyan
                - blue
                - indigo
                - purple
                - pink
                - brown
                - gray
                - gray2
                - gray3
                - gray4
                - gray5
                - gray6

        subtitle_color_template:
          name: Text color (template)
          default: ""
          description: |
            Can be used instead of "Text color" to provide a templated color.
            Must evaluate to a valid color name.
            If this template references entities, add matching triggers in "Custom automation triggers".
          selector:
            template:

        subtitle_formatter:
          name: Value formatter
          default: passthrough
          description: |
            Controls how the value is displayed.
            "Time since" shows relative time elapsed since the value (expects a timestamp).
            "Time until" shows relative time remaining until the value (expects a timestamp).
          selector:
            select:
              mode: dropdown
              options:
                - label: Pass through
                  value: passthrough
                - label: Time since
                  value: time_since
                - label: Time until
                  value: time_until

    expired:
      name: Expired
      icon: mdi:timer-off-outline
      input:
        expired_text:
          name: Expired text
          default: ""
          description: |
            Shown once the target has passed. If empty, the device shows the
            elapsed time instead.

    tap_url:
      name: Tap URL
      icon: mdi:link
      input:
        tap_url_template:
          name: Tap URL (template)
          default: ""
          description: |
            A Jinja2 template for the URL opened when the widget is tapped.
            Supports any URL scheme (https://, homeassistant://, etc.).
            If this template references entities, add matching triggers in "Custom automation triggers".
          selector:
            template:

    staleness:
      name: Staleness
      icon: mdi:clock-alert-outline
      input:
        stale_after:
          name: Mark stale after
          description: |
            Marks the widget's data as stale when no update has arrived within
            this many seconds. Set to 0 to disable. Minimum 60 seconds when enabled.
          default: 0
          selector:
            number:
              min: 0
              max: 604800
              unit_of_measurement: seconds
              mode: box

triggers:
  - trigger: state
    entity_id:
      - !input target_sensor
      - !input subtitle_sensor

  - triggers: !input custom_triggers

variables:
  slug: !input slug
  icon: !input icon
  icon_rendering_mode: !input icon_rendering_mode
  icon_primary_color: !input icon_primary_color
  icon_secondary_color: !input icon_secondary_color
  icon_tertiary_color: !input icon_tertiary_color
  icon_color_rendering: !input icon_color_rendering
  accent: !input accent
  tap_url_template: !input tap_url_template
  stale_after: !input stale_after
  target_sensor: !input target_sensor
  target_template: !input target_template
  subtitle_sensor: !input subtitle_sensor
  subtitle_template: !input subtitle_template
  subtitle_color: !input subtitle_color
  subtitle_color_template: !input subtitle_color_template
  subtitle_formatter: !input subtitle_formatter
  expired_text: !input expired_text

mode: queued
max: 10
max_exceeded: silent

actions:
  - condition: template
    value_template: "{{ as_datetime(target_template if target_template else states(target_sensor), none) is not none }}"

  - action: rest_command.update_widget
    response_variable: aivi_response
    data:
      slug: "{{ slug }}"
      payload: >-
        {% set subtitle = {
          "value": (
            subtitle_template|string
            if subtitle_template
            else (
              state_translated(subtitle_sensor)
              if state_attr(subtitle_sensor, 'unit_of_measurement') is none
              else states(subtitle_sensor, rounded=True, with_unit=True)
            )
          ),
          "text_color": (
            subtitle_color_template|string
            if subtitle_color_template
            else (
              subtitle_color
              if subtitle_color != "default"
              else None
            )
          ),
          "formatter": (
            subtitle_formatter
            if subtitle_formatter != "passthrough"
            else None
          ),
        } if (has_value(subtitle_sensor) or subtitle_template) else None %}

        {% set icon_obj = {
          "name": icon,
          "rendering_mode": icon_rendering_mode if icon_rendering_mode != "default" else None,
          "primary_color": icon_primary_color if icon_primary_color != "default" else None,
          "secondary_color": icon_secondary_color if icon_secondary_color != "default" else None,
          "tertiary_color": icon_tertiary_color if icon_tertiary_color != "default" else None,
          "color_rendering": icon_color_rendering if icon_color_rendering != "default" else None,
        } if icon else None %}

        {% set target = as_datetime(
          target_template if target_template else states(target_sensor),
          none
        ) %}

        {% set content = {
          "template": "countdown",
          "target": target.isoformat(),
          "subtitle": subtitle,
          "expired_text": expired_text if expired_text else None,
          "icon": icon_obj,
          "accent": accent if accent != "default" else None,
          "tap_url": tap_url_template|string if tap_url_template else None,
        } %}

        {% if stale_after|int(0) > 0 %}
        {{ {"content": content, "stale_after": stale_after|int} | to_json }}
        {% else %}
        {{ {"content": content} | to_json }}
        {% endif %}
