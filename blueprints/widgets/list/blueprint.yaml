blueprint:
  name: |
    Aivi: List widget using sensors
  description: |
    Updates an Aivi List widget from Home Assistant entities.

    The List template shows rows of labeled values - the generic
    multi-entity readout. Supports up to eight rows.
    See the [docs](https://docs.getaivi.app/widgets/#list-template) for more info about the template.

    Requires the `rest_command.update_widget` REST command from the
    [blueprint documentation](https://docs.getaivi.app/home-assistant/blueprints/).

  domain: automation
  homeassistant:
    min_version: 2025.7.0

  input:
    slug:
      name: Widget slug
      description: The slug of the widget to update.

    icon:
      name: Icon
      default: ""
      description: |
        An [SF Symbols](https://developer.apple.com/sf-symbols/) icon name.
        Example: house.fill.

    icon_customization:
      name: Icon customization
      icon: mdi:palette
      description: |
        Advanced rendering options for the SF Symbol icon. Leave at defaults
        for the standard monochrome appearance.
      input:
        icon_rendering_mode:
          name: Rendering mode
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: Default
                  value: default
                - label: Monochrome
                  value: monochrome
                - label: Hierarchical
                  value: hierarchical
                - label: Palette
                  value: palette
                - label: Multicolor
                  value: multicolor

        icon_primary_color:
          name: Primary color
          default: default
          selector:
            select:
              options:
                - default
                - red
                - orange
                - yellow
                - green
                - mint
                - teal
                - cyan
                - blue
                - indigo
                - purple
                - pink
                - brown
                - gray
                - gray2
                - gray3
                - gray4
                - gray5
                - gray6

        icon_secondary_color:
          name: Secondary color (palette mode)
          default: default
          selector:
            select:
              options:
                - default
                - red
                - orange
                - yellow
                - green
                - mint
                - teal
                - cyan
                - blue
                - indigo
                - purple
                - pink
                - brown
                - gray
                - gray2
                - gray3
                - gray4
                - gray5
                - gray6

        icon_tertiary_color:
          name: Tertiary color (palette mode)
          default: default
          selector:
            select:
              options:
                - default
                - red
                - orange
                - yellow
                - green
                - mint
                - teal
                - cyan
                - blue
                - indigo
                - purple
                - pink
                - brown
                - gray
                - gray2
                - gray3
                - gray4
                - gray5
                - gray6

        icon_color_rendering:
          name: Color rendering
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: Default
                  value: default
                - label: Flat
                  value: flat
                - label: Gradient
                  value: gradient

    accent:
      name: Accent color
      description: |
        An explicit accent color that themes the whole widget on the device,
        independent of the icon color.
      default: default
      selector:
        select:
          options:
            - default
            - red
            - orange
            - yellow
            - green
            - mint
            - teal
            - cyan
            - blue
            - indigo
            - purple
            - pink
            - brown
            - gray
            - gray2
            - gray3
            - gray4
            - gray5
            - gray6

    custom_triggers:
      name: Custom automation triggers
      description: |
        Template fields do not automatically create triggers.
        Add one trigger for each entity referenced by a template field (usually a `state` trigger).
        These triggers are evaluated together with the built-in sensor triggers.
      default: []
      selector:
        trigger:

    rows:
      name: Rows
      description: One row per entity, up to 8.
      selector:
        object:
          multiple: true
          label_field: label
          fields:
            label:
              label: Label
              required: true
              selector:
                text:
            entity:
              label: Value (entity)
              required: true
              selector:
                entity:
            color:
              label: Text color
              selector:
                select:
                  options:
                    - default
                    - red
                    - orange
                    - yellow
                    - green
                    - mint
                    - teal
                    - cyan
                    - blue
                    - indigo
                    - purple
                    - pink
                    - brown
                    - gray
                    - gray2
                    - gray3
                    - gray4
                    - gray5
                    - gray6
            formatter:
              label: Value formatter
              selector:
                select:
                  mode: dropdown
                  options:
                    - label: Pass through
                      value: passthrough
                    - label: Time since
                      value: time_since
                    - label: Time until
                      value: time_until
            icon:
              label: Icon (SF Symbol)
              selector:
                text:

    watched:
      name: Watched entities
      description: |
        Entities referenced in the rows above are not watched automatically.
        Select them here so their changes trigger a widget update.
      selector:
        entity:
          multiple: true

    tap_url:
      name: Tap URL
      icon: mdi:link
      input:
        tap_url_template:
          name: Tap URL (template)
          default: ""
          description: |
            A Jinja2 template for the URL opened when the widget is tapped.
            Supports any URL scheme (https://, homeassistant://, etc.).
            If this template references entities, add matching triggers in "Custom automation triggers".
          selector:
            template:

    staleness:
      name: Staleness
      icon: mdi:clock-alert-outline
      input:
        stale_after:
          name: Mark stale after
          description: |
            Marks the widget's data as stale when no update has arrived within
            this many seconds. Set to 0 to disable. Minimum 60 seconds when enabled.
          default: 0
          selector:
            number:
              min: 0
              max: 604800
              unit_of_measurement: seconds
              mode: box

triggers:
  - trigger: state
    entity_id: !input watched

  - triggers: !input custom_triggers

variables:
  slug: !input slug
  icon: !input icon
  icon_rendering_mode: !input icon_rendering_mode
  icon_primary_color: !input icon_primary_color
  icon_secondary_color: !input icon_secondary_color
  icon_tertiary_color: !input icon_tertiary_color
  icon_color_rendering: !input icon_color_rendering
  accent: !input accent
  tap_url_template: !input tap_url_template
  stale_after: !input stale_after
  rows: !input rows

mode: queued
max: 10
max_exceeded: silent

actions:
  - condition: template
    value_template: >-
      {% set ns = namespace(any=false) %}
      {% for r in rows if r.get('entity') and has_value(r.entity) %}
      {% set ns.any = true %}
      {% endfor %}
      {{ ns.any }}

  - action: rest_command.update_widget
    response_variable: aivi_response
    data:
      slug: "{{ slug }}"
      payload: >-
        {% set ns = namespace(rows=[]) %}
        {% for r in rows[:8] if r.get('entity') and r.get('label') and has_value(r.entity) %}
        {% set ns.rows = ns.rows + [{
          "label": r.label,
          "value": {
            "value": (
              state_translated(r.entity)
              if state_attr(r.entity, 'unit_of_measurement') is none
              else states(r.entity, rounded=True, with_unit=True)
            ),
            "text_color": r.get('color') if r.get('color', 'default') != 'default' else None,
            "formatter": r.get('formatter') if r.get('formatter', 'passthrough') != 'passthrough' else None,
          },
          "icon": r.get('icon') or None,
        }] %}
        {% endfor %}

        {% set icon_obj = {
          "name": icon,
          "rendering_mode": icon_rendering_mode if icon_rendering_mode != "default" else None,
          "primary_color": icon_primary_color if icon_primary_color != "default" else None,
          "secondary_color": icon_secondary_color if icon_secondary_color != "default" else None,
          "tertiary_color": icon_tertiary_color if icon_tertiary_color != "default" else None,
          "color_rendering": icon_color_rendering if icon_color_rendering != "default" else None,
        } if icon else None %}

        {% set content = {
          "template": "list",
          "rows": ns.rows,
          "icon": icon_obj,
          "accent": accent if accent != "default" else None,
          "tap_url": tap_url_template|string if tap_url_template else None,
        } %}

        {% if stale_after|int(0) > 0 %}
        {{ {"content": content, "stale_after": stale_after|int} | to_json }}
        {% else %}
        {{ {"content": content} | to_json }}
        {% endif %}
