      icon: mdi:link
      input:
        tap_url_template:
          name: Tap URL (template)
          default: ""
          description: |
            A Jinja2 template for the URL opened when the widget is tapped.
            Supports any URL scheme (https://, homeassistant://, etc.).
            If this template references entities, add matching triggers in "Custom automation triggers".
          selector:
            template:

    staleness:
      name: Staleness
      icon: mdi:clock-alert-outline
      input:
        stale_after:
          name: Mark stale after
          description: |
            Marks the widget's data as stale when no update has arrived within
            this many seconds. Set to 0 to disable. Minimum 60 seconds when enabled.
          default: 0
          selector:
            number:
              min: 0
              max: 604800
              unit_of_measurement: seconds
              mode: box

triggers:
  - trigger: state
    entity_id:
      - !input row_1_entity
      - !input row_2_entity
      - !input row_3_entity
      - !input row_4_entity
      - !input row_5_entity
      - !input row_6_entity

  - triggers: !input custom_triggers

variables:
  slug: !input slug
  icon: !input icon
  icon_rendering_mode: !input icon_rendering_mode
  icon_primary_color: !input icon_primary_color
  icon_secondary_color: !input icon_secondary_color
  icon_tertiary_color: !input icon_tertiary_color
  icon_color_rendering: !input icon_color_rendering
  accent: !input accent
  tap_url_template: !input tap_url_template
  stale_after: !input stale_after
  row_1_label: !input row_1_label
  row_1_entity: !input row_1_entity
  row_1_color: !input row_1_color
  row_1_formatter: !input row_1_formatter
  row_1_icon: !input row_1_icon
  row_2_label: !input row_2_label
  row_2_entity: !input row_2_entity
  row_2_color: !input row_2_color
  row_2_formatter: !input row_2_formatter
  row_2_icon: !input row_2_icon
  row_3_label: !input row_3_label
  row_3_entity: !input row_3_entity
  row_3_color: !input row_3_color
  row_3_formatter: !input row_3_formatter
  row_3_icon: !input row_3_icon
  row_4_label: !input row_4_label
  row_4_entity: !input row_4_entity
  row_4_color: !input row_4_color
  row_4_formatter: !input row_4_formatter
  row_4_icon: !input row_4_icon
  row_5_label: !input row_5_label
  row_5_entity: !input row_5_entity
  row_5_color: !input row_5_color
  row_5_formatter: !input row_5_formatter
  row_5_icon: !input row_5_icon
  row_6_label: !input row_6_label
  row_6_entity: !input row_6_entity
  row_6_color: !input row_6_color
  row_6_formatter: !input row_6_formatter
  row_6_icon: !input row_6_icon

mode: queued
max: 10
max_exceeded: silent

actions:
  - condition: template
    value_template: "{{ has_value(row_1_entity) or has_value(row_2_entity) or has_value(row_3_entity) or has_value(row_4_entity) or has_value(row_5_entity) or has_value(row_6_entity) }}"

  - action: rest_command.update_widget
    response_variable: aivi_response
    data:
      slug: "{{ slug }}"
      payload: >-
        {% set rows = [] %}
        {% if has_value(row_1_entity) and row_1_label %}
        {% set rows = rows + [{
          "label": row_1_label,
          "value": {
            "value": (
              state_translated(row_1_entity)
              if state_attr(row_1_entity, 'unit_of_measurement') is none
              else states(row_1_entity, rounded=True, with_unit=True)
            ),
            "text_color": row_1_color if row_1_color != "default" else None,
            "formatter": row_1_formatter if row_1_formatter != "passthrough" else None,
          },
          "icon": row_1_icon if row_1_icon else None,
        }] %}
        {% endif %}
        {% if has_value(row_2_entity) and row_2_label %}
        {% set rows = rows + [{
          "label": row_2_label,
          "value": {
            "value": (
              state_translated(row_2_entity)
              if state_attr(row_2_entity, 'unit_of_measurement') is none
              else states(row_2_entity, rounded=True, with_unit=True)
            ),
            "text_color": row_2_color if row_2_color != "default" else None,
            "formatter": row_2_formatter if row_2_formatter != "passthrough" else None,
          },
          "icon": row_2_icon if row_2_icon else None,
        }] %}
        {% endif %}
        {% if has_value(row_3_entity) and row_3_label %}
        {% set rows = rows + [{
          "label": row_3_label,
          "value": {
            "value": (
              state_translated(row_3_entity)
              if state_attr(row_3_entity, 'unit_of_measurement') is none
              else states(row_3_entity, rounded=True, with_unit=True)
            ),
            "text_color": row_3_color if row_3_color != "default" else None,
            "formatter": row_3_formatter if row_3_formatter != "passthrough" else None,
          },
          "icon": row_3_icon if row_3_icon else None,
        }] %}
        {% endif %}
        {% if has_value(row_4_entity) and row_4_label %}
        {% set rows = rows + [{
          "label": row_4_label,
          "value": {
            "value": (
              state_translated(row_4_entity)
              if state_attr(row_4_entity, 'unit_of_measurement') is none
              else states(row_4_entity, rounded=True, with_unit=True)
            ),
            "text_color": row_4_color if row_4_color != "default" else None,
            "formatter": row_4_formatter if row_4_formatter != "passthrough" else None,
          },
          "icon": row_4_icon if row_4_icon else None,
        }] %}
        {% endif %}
        {% if has_value(row_5_entity) and row_5_label %}
        {% set rows = rows + [{
          "label": row_5_label,
          "value": {
            "value": (
              state_translated(row_5_entity)
              if state_attr(row_5_entity, 'unit_of_measurement') is none
              else states(row_5_entity, rounded=True, with_unit=True)
            ),
            "text_color": row_5_color if row_5_color != "default" else None,
            "formatter": row_5_formatter if row_5_formatter != "passthrough" else None,
          },
          "icon": row_5_icon if row_5_icon else None,
        }] %}
        {% endif %}
        {% if has_value(row_6_entity) and row_6_label %}
        {% set rows = rows + [{
          "label": row_6_label,
          "value": {
            "value": (
              state_translated(row_6_entity)
              if state_attr(row_6_entity, 'unit_of_measurement') is none
              else states(row_6_entity, rounded=True, with_unit=True)
            ),
            "text_color": row_6_color if row_6_color != "default" else None,
            "formatter": row_6_formatter if row_6_formatter != "passthrough" else None,
          },
          "icon": row_6_icon if row_6_icon else None,
        }] %}
        {% endif %}

        {% set icon_obj = {
          "name": icon,
          "rendering_mode": icon_rendering_mode if icon_rendering_mode != "default" else None,
          "primary_color": icon_primary_color if icon_primary_color != "default" else None,
          "secondary_color": icon_secondary_color if icon_secondary_color != "default" else None,
          "tertiary_color": icon_tertiary_color if icon_tertiary_color != "default" else None,
          "color_rendering": icon_color_rendering if icon_color_rendering != "default" else None,
        } if icon else None %}

        {% set content = {
          "template": "list",
          "rows": rows,
          "icon": icon_obj,
          "accent": accent if accent != "default" else None,
          "tap_url": tap_url_template|string if tap_url_template else None,
        } %}

        {% if stale_after|int(0) > 0 %}
        {{ {"content": content, "stale_after": stale_after|int} | to_json }}
        {% else %}
        {{ {"content": content} | to_json }}
        {% endif %}
